server {
    listen 80;
    server_name _;

    # Document root - папка public. Только она доступна извне.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10M;

    # Все запросы, для которых нет реального файла, идут в index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обработка PHP через PHP-FPM.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Запрет доступа к скрытым файлам (.env, .git и т.п.).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Кэширование статики.
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
